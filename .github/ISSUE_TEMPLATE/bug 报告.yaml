name: "🐛 Bug 反馈"
description: 错别字、无法生效、冲突
title: "[Bug] "
labels: [Bug]
body:
  - type: checkboxes
    attributes:
      label: 必填确认项
      description: 提交前请确认以下内容
      options:
        - label: "我已搜索现有Issue，未找到相同问题"
          required: true
        - label: "此问题在项目最新版本中仍可复现"
          required: true
        - label: "我已将资源包更新为最新版本"
          required: true
        - label: "过于简单的且无法清晰描述的Issue可能会直接关闭"
          required: true

  - type: textarea
    attributes:
      label: 问题描述
      placeholder: "清晰说明 Bug 现象"
    validations:
      required: true

  # 新增平台版本选择字段（必填）
  - type: dropdown
    attributes:
      label: Minecraft平台
      options:
        - "请选择"
        - "Java版"
        - "基岩版"
    validations:
      required: true  # 强制用户必须选择

  - type: textarea
    attributes:
      label: 游戏版本
      placeholder: "你的Minecraft版本，Java通常位于标题屏幕左下角，基岩版通常位于主菜单右下角"
    validations:
      required: true

  - type: textarea
    attributes:
      label: 附加信息
      placeholder: "截图、日志等"

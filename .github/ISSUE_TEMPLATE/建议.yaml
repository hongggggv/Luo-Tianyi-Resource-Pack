name: "优化 "
description: 一些好的优化都可以留下！
title: "[优化] "
labels: [优化, 等待审核]
body:
  - type: checkboxes
    attributes:
      label: 必填确认项
      description: 提交前请确认以下内容
      options:
        - label: "我已搜索现有 [Issue](https://github.com/hongggggv/Tianyicraft/issues) 或 [Pull request](https://github.com/hongggggv/Tianyicraft/pulls)，确认这一优化没有人提交过"
          required: true
        - label: "此优化在最新版本尚未实现并且更新我已为最新版本"
          required: true
        - label: "过于简单且无法清晰描述的 Issue 可能会直接关闭"
          required: true

  - type: textarea
    attributes:
      label: 描述建议
      placeholder: "清晰说明你的优化建议"
    validations:
      required: true
      
  - type: dropdown
    attributes:
      label: Minecraft 平台
      options:
        - "请选择"
        - "Java 版"
        - "基岩版"
        - "Java 版、基岩版"
    validations:
      required: true

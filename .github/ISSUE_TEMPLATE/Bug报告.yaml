name: "🐛 Bug 反馈"
description: 错别字、无法生效等一系列 Bug
title: "[Bug] "
labels: [Bug]
body:
  - type: checkboxes
    attributes:
      label: 必填确认项
      description: 提交前请确认以下内容
      options:
        - label: "我已搜索现有 [Issue](https://github.com/hongggggv/Tianyicraft/issues) 或 [Pull request](https://github.com/hongggggv/Tianyicraft/pulls)，确认没有人提交过这个 Bug"
          required: true
        - label: "此 Bug 在项目最新版本中仍可复现并且我已更新为最新版本"
          required: true
        - label: "我知晓大部分冲突的问题都是由模组造成的，但我确实认为与模组冲突类型的 Bug 可以修复"
          required: true

  - type: textarea
    attributes:
      label: 问题描述
      placeholder: "清晰说明 Bug 现象"
    validations:
      required: true

  - type: dropdown
    attributes:
      label: Minecraft 平台
      options:
        - "请选择"
        - "Java 版"
        - "基岩版"
    validations:
      required: true

  - type: input
    attributes:
      label: Minecraft 版本
      placeholder: "Java 版通常位于标题屏幕左下角，基岩版通常位于右下角，例如：1.21.5、25w20a、1.21.80"
    validations:
      required: true

  - type: textarea
    attributes:
      label: 日志
      placeholder: "请将游戏日志（latest.log）拖拽上传（仅 Java 版，基岩版请填写“基岩版”，错别字请填写“错别字”）"
    validations:
      required: true
